version: '3'

tasks:
  install:
    desc: Install dependencies with uv
    cmds:
      - uv sync --all-extras

  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check superrobot tests

  format:
    desc: Run ruff formatter
    cmds:
      - uv run ruff format superrobot tests

  format-check:
    desc: Check ruff formatting
    cmds:
      - uv run ruff format --check superrobot tests

  typecheck:
    desc: Run mypy strict type checking
    cmds:
      - uv run mypy superrobot

  test:
    desc: Run unit tests (excludes integration)
    cmds:
      - uv run pytest tests/unit -v

  test-all:
    desc: Run all tests including integration
    cmds:
      - uv run pytest tests -v

  qa:
    desc: Full quality assurance pipeline
    cmds:
      - task: lint
      - task: format-check
      - task: typecheck
      - task: test
