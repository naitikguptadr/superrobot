[project]
name = "superrobot"
version = "0.1.0"
description = "Bring any Python agent to DataRobot without rebuilding it from scratch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.62.0",
    "typer>=0.12.0",
    "pydantic>=2.0",
    "jinja2>=3.1.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML",
    "types-Jinja2",
]

[project.scripts]
superrobot = "superrobot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["superrobot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that call real external services",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["textual.*", "pytest_textual_snapshot.*"]
ignore_missing_imports = true
